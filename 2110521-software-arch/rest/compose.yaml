services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutor_matcher_assignment
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - assignment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tutor_matcher_assignment"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/tutor_matcher_assignment
      PORT: "8000"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  assignment_postgres_data:
